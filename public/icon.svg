<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021c16" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="4" />

  <!-- Target reticle frame corners (Scanner) -->
  <path d="M 120 170 L 120 130 A 10 10 0 0 1 130 120 L 170 120" stroke="#34d399" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 342 120 L 382 120 A 10 10 0 0 1 392 130 L 392 170" stroke="#34d399" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 120 342 L 120 382 A 10 10 0 0 0 130 392 L 170 392" stroke="#34d399" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 342 392 L 382 392 A 10 10 0 0 0 392 382 L 392 342" stroke="#34d399" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Center Plant Leaf -->
  <g filter="url(#glow)">
    <!-- Main leaf body -->
    <path d="M 256 140 C 180 180 150 270 180 340 C 200 380 250 395 256 395 C 262 395 312 380 332 340 C 362 270 332 180 256 140 Z" fill="url(#leafGrad)" />
    <!-- Leaf central vein -->
    <path d="M 256 160 Q 256 270 256 385" stroke="#042f2e" stroke-width="6" stroke-linecap="round" opacity="0.7" fill="none" />
    <!-- Side veins -->
    <path d="M 256 210 Q 220 230 195 245" stroke="#042f2e" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none" />
    <path d="M 256 240 Q 295 255 315 275" stroke="#042f2e" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none" />
    <path d="M 256 280 Q 225 295 205 315" stroke="#042f2e" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none" />
    <path d="M 256 310 Q 285 325 305 340" stroke="#042f2e" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none" />
  </g>

  <!-- Laser AI Scan Ray -->
  <rect x="130" y="248" width="252" height="6" rx="3" fill="url(#scanGrad)" />
  <circle cx="256" cy="251" r="5" fill="#ffffff" filter="url(#glow)" />

  <!-- Golden Health / AI Sparkle Badge -->
  <g transform="translate(325, 145)">
    <circle cx="20" cy="20" r="24" fill="#042f2e" stroke="#fbbf24" stroke-width="4" />
    <path d="M 20 6 L 23 16 L 33 17 L 25 23 L 28 33 L 20 27 L 12 33 L 15 23 L 7 17 L 17 16 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Typography badge at bottom -->
  <text x="256" y="445" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">AGRISCAN AI</text>
</svg>
