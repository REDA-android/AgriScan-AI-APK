<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Remix AgriScan AI to APK</title>
    <meta name="description" content="An AI-powered agricultural tool with Gemini Live real-time camera and voice analysis for scanning crops, detecting diseases, and providing instant plant health diagnostics." />
    <meta name="theme-color" content="#064e3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgriScan AI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.includes('[vite]') || firstArg.includes('WebSocket') || firstArg.includes('ws://') || firstArg.includes('wss://'))) {
            return;
          }
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.includes('[vite]') || firstArg.includes('WebSocket'))) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
      })();
      window.onerror = function(message, source, lineno, colno, error) {
        var msg = String(message);
        if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('HMR')) return;
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100vw';
        errorDiv.style.height = '100vh';
        errorDiv.style.backgroundColor = 'white';
        errorDiv.style.color = 'red';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.padding = '20px';
        errorDiv.style.overflow = 'auto';

        var h3 = document.createElement('h3');
        h3.innerText = 'Initial App Crash';
        errorDiv.appendChild(h3);

        var p1 = document.createElement('p');
        p1.innerText = 'Message: ' + message;
        errorDiv.appendChild(p1);

        var p2 = document.createElement('p');
        p2.innerText = 'Source: ' + source + ':' + lineno + ':' + colno;
        errorDiv.appendChild(p2);

        var pre = document.createElement('pre');
        pre.innerText = error && error.stack ? error.stack : '';
        errorDiv.appendChild(pre);

        document.body.appendChild(errorDiv);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var reasonStr = String(reason);
        if (reasonStr.includes('WebSocket') || reasonStr.includes('vite')) return;
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '50px';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100vw';
        errorDiv.style.backgroundColor = 'white';
        errorDiv.style.color = 'red';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.padding = '20px';

        var h3 = document.createElement('h3');
        h3.innerText = 'Initial Unhandled Rejection';
        errorDiv.appendChild(h3);

        var p = document.createElement('p');
        p.innerText = 'Reason: ' + reasonStr;
        errorDiv.appendChild(p);

        document.body.appendChild(errorDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" defer src="/src/main.tsx"></script>
  </body>
</html>
